services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adocao
      POSTGRES_PASSWORD: adocao
      POSTGRES_DB: adocao
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # descomenta quando for usar redis (cache/filas)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - '6379:6379'

volumes:
  pgdata:
